<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Task 😌</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
        color: white;
        background: linear-gradient(-45deg, #667eea, #764ba2, #ff6a88, #ff99ac);
        background-size: 400% 400%;
        animation: gradientMove 10s ease infinite;
    }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .container {
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(20px);
        padding: 50px;
        border-radius: 25px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        text-align: center;
        position: relative;
        animation: popIn 0.8s ease;
    }

    @keyframes popIn {
        from { transform: scale(0.7); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    h1 {
        font-size: 2.2rem;
        margin-bottom: 15px;
    }

    p {
        font-size: 1.2rem;
        margin-bottom: 40px;
    }

    .buttons {
        position: relative;
        height: 120px;
    }

    button {
        padding: 15px 35px;
        font-size: 18px;
        border: none;
        border-radius: 40px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s ease;
        margin: 10px;
    }

    #yesBtn {
        background: white;
        color: #764ba2;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    #yesBtn:hover {
        transform: scale(1.15);
    }

    #noBtn {
        background: #ff4b7d;
        color: white;
        position: absolute;
        transition: transform 0.2s ease;
    }

    /* Floating emojis */
    .emoji {
        position: absolute;
        font-size: 25px;
        animation: float 6s linear infinite;
        opacity: 0.6;
    }

    @keyframes float {
        0% { transform: translateY(100vh) rotate(0deg); }
        100% { transform: translateY(-10vh) rotate(360deg); }
    }

    .celebrate {
        position: fixed;
        font-size: 30px;
        animation: explode 1s ease forwards;
    }

    @keyframes explode {
        0% { opacity: 1; transform: scale(0.5); }
        100% { opacity: 0; transform: scale(3); }
    }
</style>
</head>

<body>

<div class="container">
    <h1>Important Announcement 😌</h1>
    <p>Please go to the kitchen and clean the dishes immediately.</p>

    <div class="buttons">
        <button id="yesBtn">Fine 😒</button>
        <button id="noBtn">No 😤</button>
    </div>
</div>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const container = document.querySelector(".container");
  
  yesBtn.addEventListener("click", function() {
      launchCelebration();
      setTimeout(() => {
          window.location.href = "https://piyushgupta-29.github.io/wybmv/";
      }, 1200);
  });
  
  function moveRandomly() {
      const containerRect = container.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();
  
      const maxX = containerRect.width - btnRect.width;
      const maxY = containerRect.height - btnRect.height;
  
      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;
  
      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";
      noBtn.style.transform = "rotate(" + (Math.random()*360) + "deg)";
  }
  
  noBtn.addEventListener("mouseenter", moveRandomly);
  noBtn.addEventListener("touchstart", moveRandomly);
  
  // Floating emojis
  const emojis = ["😤","😒","😌","🍽️","🧽","✨"];
  for (let i = 0; i < 15; i++) {
      const span = document.createElement("span");
      span.classList.add("emoji");
      span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      span.style.left = Math.random() * 100 + "vw";
      span.style.animationDuration = (4 + Math.random() * 6) + "s";
      document.body.appendChild(span);
  }
  
  // Celebration effect
  function launchCelebration() {
      for (let i = 0; i < 25; i++) {
          const burst = document.createElement("div");
          burst.classList.add("celebrate");
          burst.innerText = "🎉";
          burst.style.left = Math.random() * 100 + "vw";
          burst.style.top = Math.random() * 100 + "vh";
          document.body.appendChild(burst);
  
          setTimeout(() => burst.remove(), 1000);
      }
  }
  </script>
  

</body>
</html>
